<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Las aventuras de Zacarías</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section id="cover" class="cover-screen">
      <div class="cover-card">
        <p class="small-label">Cuento interactivo</p>
        <h1 class="main-title"><span>Las aventuras</span><span>de</span><span class="zacarias-word">Zacarías</span></h1>
        <button id="coverCatButton" class="cover-cat-button" aria-label="Tocar a Zacarías">
          <img id="coverCat" src="assets/ui/portada-zacarias/pose-01.png" alt="Zacarías">
        </button>
        <p id="purrText" class="purr-text" aria-live="polite"></p>
        <button id="startBtn" class="start-btn">🐾 Comenzar la aventura 🐾</button>
        <p id="dedication" class="dedication">Para nuestro amado hijo SVBO ❤️</p>
      </div>
    </section>

    <section id="reader" class="reader-screen hidden">
      <div class="reader-shell">
        <section class="text-panel">
          <p id="sceneCounter" class="scene-counter"></p>
          <div id="sceneText" class="scene-text"></div>
          <p id="sceneHint" class="scene-hint"></p>
          <p id="rewardText" class="reward-text" aria-live="polite"></p>
        </section>
        <section id="stage" class="stage" aria-label="Escena interactiva">
          <img id="backgroundImage" class="background-image" alt="">
          <div id="charactersLayer" class="layer characters-layer"></div>
          <div id="objectsLayer" class="layer objects-layer"></div>
          <div id="effectsLayer" class="layer effects-layer"></div>
        </section>
      </div>
      <button id="homeBtn" class="round-btn home-btn" aria-label="Volver a la portada">⌂</button>
      <button id="musicBtn" class="round-btn music-btn" aria-label="Música">🎵</button>
      <button id="narrationBtn" class="round-btn narration-btn" aria-label="Narración">🔊</button>
      <button id="prevBtn" class="nav-btn prev" aria-label="Página anterior">‹</button>
      <button id="nextBtn" class="nav-btn next" aria-label="Página siguiente">›</button>
      <p id="versionText" class="version">Motor Zacarías v1.0.0</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
