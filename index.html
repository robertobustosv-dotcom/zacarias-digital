<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Las Aventuras de Zacarías</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main id="app" class="storybook">
    <section id="cover" class="cover">
      <div class="cover-card">
        <p class="eyebrow">Cuento interactivo</p>
        <h1>Las Aventuras<br>de Zacarías</h1>
        <p class="subtitle">Una historia de valentía, hogar y amor.</p>
        <button id="startBtn" class="primary-btn">Comenzar</button>
      </div>
    </section>

    <section id="reader" class="reader hidden">
      <div class="top-controls">
        <button id="narrationBtn" class="icon-btn" title="Narración">🔊</button>
        <button id="musicBtn" class="icon-btn" title="Música">🎵</button>
      </div>

      <button id="prevBtn" class="nav-btn nav-left" title="Anterior">‹</button>
      <button id="nextBtn" class="nav-btn nav-right" title="Siguiente">›</button>

      <article class="page-layout">
        <div class="text-panel">
          <p id="sceneLabel" class="scene-label"></p>
          <h2 id="sceneTitle"></h2>
          <div id="sceneText" class="scene-text"></div>
        </div>

        <div class="image-panel">
          <img id="sceneImage" alt="Ilustración del cuento de Zacarías" />
          <div id="weatherLayer" class="weather-layer"></div>
        </div>
      </article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
