<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6cdbd" />
  <title>Las aventuras de Zacarías</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app">
    <section id="cover" class="cover">
      <div class="cover-card">
        <img src="assets/scenes/scene-1.png" alt="Zacarías" />
        <h1>Las aventuras de Zacarías</h1>
        <p>Un cuento interactivo para leer, escuchar y descubrir.</p>
        <button id="startBtn">Comenzar aventura</button>
      </div>
    </section>

    <section id="reader" class="reader hidden" aria-live="polite">
      <div class="storybook" id="storybook">
        <div class="story-controls" id="controls">
          <button id="musicBtn" class="round" title="Música">♫</button>
          <button id="narrationBtn" class="round" title="Narración">🔊</button>
          <button id="autoBtn" class="round" title="Auto lectura">▶</button>
          <button id="fullBtn" class="round" title="Pantalla completa">⛶</button>
        </div>

        <section class="text-panel">
          <div class="counter" id="counter">1 / 9</div>
          <h2 id="title"></h2>
          <div id="text" class="text"></div>
          <button id="mission" class="mission"></button>
        </section>

        <section class="scene-panel">
          <div class="stage" id="stage">
            <img id="sceneImage" class="scene-image" alt="Ilustración del cuento" />
            <div id="effects" class="effects"></div>
            <button id="hotspot" class="hotspot">🐾</button>
            <div id="bubble" class="bubble"></div>
          </div>
        </section>

        <button id="prevBtn" class="nav prev" title="Anterior">‹</button>
        <button id="nextBtn" class="nav next" title="Siguiente">›</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
