<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Las aventuras de Zacarías</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <section id="cover" class="cover-screen">
      <div class="cover-content">
        <p class="small-label">Cuento interactivo</p>

        <h1 class="main-title">
          <span>Las aventuras</span>
          <span>de</span>
          <span class="zacarias-word">Zacarías</span>
        </h1>

        <button id="catButton" class="cat-button" aria-label="Tocar a Zacarías">
          <img src="assets/ui/portada-zacarias.png" alt="Zacarías">
        </button>

        <p id="purrText" class="purr-text" aria-live="polite"></p>

        <button id="startBtn" class="start-btn">🐾 Comenzar la aventura 🐾</button>

        <p id="dedication" class="dedication">Para nuestro amado hijo SVBO ❤️</p>
      </div>
    </section>

    <section id="reader" class="reader-screen hidden">
      <div class="reader-card">
        <section class="text-panel">
          <p id="sceneCounter" class="scene-counter"></p>
          <h2 id="sceneTitle"></h2>
          <div id="sceneText" class="scene-text"></div>
          <p id="sceneHint" class="scene-hint"></p>
          <p id="rewardText" class="reward-text"></p>
        </section>

        <section id="imagePanel" class="image-panel">
          <div id="placeholderScene" class="placeholder-scene">
            <img id="placeholderCat" src="assets/ui/portada-zacarias.png" alt="Zacarías">
            <p>Ilustración de la escena</p>
          </div>
          <img id="sceneImage" class="scene-image hidden" alt="Ilustración de la escena">
          <img
    id="zacariasCharacter"
    class="character"
    src="assets/characters/zacarias/zacarias-cover.png"
    alt="Zacarías">
         <button id="hiddenObject" class="hidden-object hidden" aria-label="Objeto escondido">
  <img id="objectImage" src="assets/objects/ovillo.jpg" alt="Ovillo">
</button>
          <div id="particleLayer" class="particle-layer"></div>
        </section>
      </div>

      <button id="prevBtn" class="nav-btn prev" aria-label="Anterior">‹</button>
      <button id="nextBtn" class="nav-btn next" aria-label="Siguiente">›</button>

      <div class="top-buttons">
        <button id="musicBtn" class="round-btn" aria-label="Música">🎵</button>
        <button id="narrationBtn" class="round-btn" aria-label="Narración">🔊</button>
      </div>

      <p id="versionText" class="version">Motor Zacarías v0.2.0</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
